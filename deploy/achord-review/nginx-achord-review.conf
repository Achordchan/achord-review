# /etc/nginx/sites-available/achord-review.conf
# Certificates are issued and renewed by the host's existing certbot + certbot.timer:
#   certbot certonly --webroot -w /var/www/letsencrypt -d review.achord.cn \
#     --cert-name review.achord.cn --key-type ecdsa --non-interactive --agree-tos

server {
    listen 80;
    listen [::]:80;
    server_name review.achord.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name review.achord.cn;

    ssl_certificate     /etc/letsencrypt/live/review.achord.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/review.achord.cn/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Webhook deliveries carry the whole PR payload; the dashboard API never does.
    client_max_body_size 32m;
    # an AI review can take tens of seconds to minutes; keep the upstream timeouts generous
    proxy_read_timeout 1200s;
    proxy_send_timeout 1200s;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # Dashboard SPA is served by the same upstream (FastAPI serves the static
    # build from pr_agent/dashboard/static), so a single location covers both.
    location / {
        proxy_pass http://127.0.0.1:33001;
    }

    # Unauthenticated clients reach the dashboard API, so cap its bodies at the
    # edge as well; the app enforces the same 64 KiB limit before parsing.
    location /api/v1/dashboard/ {
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:33001;
    }
}
