# achord-review — central GitHub App deployment
#
# The container binds to loopback only; the host's existing nginx terminates TLS and
# reverse-proxies to it (see nginx-achord-review.conf). Do not publish 80/443 here:
# nginx already owns those ports on the target host.
#
# Config layout: the host directory ./config is mounted over the container's
# settings_prod directory. It must contain .secrets.toml. Migrating from the old
# single-file layout (./config.toml on the host):
#   mkdir -p config && mv config.toml config/.secrets.toml && chmod 600 config/.secrets.toml
# The parent directory is mounted rather than the file itself so the dashboard
# config editor can back up and atomically replace .secrets.toml.
services:
  achord-review:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: github_app
    image: achord-review:latest
    container_name: achord-review
    restart: unless-stopped
    # In-panel updates (opt-in): start through the release launcher. It creates
    # a detached initial worktree and runs from the stable `current` symlink.
    # Updates are staged in another worktree and the symlink changes atomically
    # only when the restart is initiated, so live Python/static files are never
    # modified in place. A host rebuild always wins: the launcher detects the new
    # image and runs the rebuilt source HEAD, discarding any older staged release,
    # then prunes superseded worktrees. Uncomment together with the mounts/env below.
    #command: ["/bin/sh", "/app/source/deploy/achord-review/run-staged-release.sh"]
    # The panel runs `git fetch`/`worktree add` as the container user. As root (the
    # default) fetched objects become root-owned in the mounted checkout — fine when
    # that checkout is root-managed (the shipped /opt/achord-review is). If a non-root
    # host user owns it, map the container to that user's UID:GID so host-side git
    # stays writable:
    #user: "1000:1000"
    ports:
      - "127.0.0.1:33001:3000"
    volumes:
      - ./config:/app/pr_agent/settings_prod
      # Dashboard SQLite database (review history, audit logs); survives restarts.
      - ./data:/app/data
      # --- In-panel code updates (opt-in) -------------------------------------
      # The source checkout supplies Git metadata but is never pulled in place.
      # Prepared worktrees live in a separate persistent release directory.
      #- ../..:/app/source
      #- ./releases:/app/releases
      # Releases use this stable config path instead of a checkout-relative mount.
      # Required for staged updates: without it the panel refuses to stage.
      #- ./config:/app/config
    environment:
      # Keep at least two workers (the gunicorn default) so a slow provider call
      # cannot stall health checks and unrelated webhooks. Dashboard sessions
      # and login lockouts are shared through SQLite; config changes are picked
      # up by each worker on its next request.
      GUNICORN_WORKERS: "2"
      # The published port is loopback-only behind the single documented nginx.
      # Direct/custom deployments default to zero trusted hops and must opt in.
      DASHBOARD_TRUSTED_PROXY_HOPS: "1"
      # Exact public browser origin used by the CSRF fallback when Fetch
      # Metadata headers are unavailable. Scheme and effective port matter.
      DASHBOARD_EXTERNAL_ORIGIN: "https://review.achord.cn"
      # In-panel updates (opt-in) — uncomment with command and mounts above.
      #ACHORD_REVIEW_SOURCE_DIR: "/app/source"
      #ACHORD_REVIEW_RELEASES_DIR: "/app/releases"
      #ACHORD_REVIEW_REPO_DIR: "/app/releases/current"
      #ACHORD_REVIEW_UPDATE_REF: "origin/main"
      #ACHORD_REVIEW_SELF_RESTART: "1"
      #ACHORD_REVIEW_CONFIG_DIR: "/app/config"
      # Left commented by default: releases stay host-managed
      # (git pull --ff-only + docker compose up -d --build).
    mem_limit: 900m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
