# achord-review — central GitHub App deployment
#
# The container binds to loopback only; the host's existing nginx terminates TLS and
# reverse-proxies to it (see nginx-achord-review.conf). Do not publish 80/443 here:
# nginx already owns those ports on the target host.
services:
  achord-review:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: github_app
    image: achord-review:latest
    container_name: achord-review
    restart: unless-stopped
    ports:
      - "127.0.0.1:33001:3000"
    volumes:
      # Secrets live here, never baked into the image. The parent directory is
      # mounted (not the file itself) so the dashboard config editor can back up
      # and atomically replace config.toml — a single-file bind mount would be
      # read-only for os.replace and every save would fail.
      - ./config:/app/pr_agent/settings_prod
      # Dashboard SQLite database (review history, audit logs); survives restarts.
      - ./data:/app/data
      # One-click restart from the panel shells out to the host docker daemon.
      # Read-only socket: the panel can restart the (fixed) container, nothing else.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # docker CLI for the restart button (the slim base image ships none)
      - /usr/bin/docker:/usr/bin/docker:ro
    environment:
      # In-memory dashboard sessions live per worker process, so this
      # deployment must run exactly one worker — with several, a login served
      # by one worker would 401 on a sibling. One uvicorn worker still answers
      # health checks while a review runs (all I/O is async).
      GUNICORN_WORKERS: "1"
    mem_limit: 900m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
