# achord-review — central GitHub App deployment
#
# The container binds to loopback only; the host's existing nginx terminates TLS and
# reverse-proxies to it (see nginx-achord-review.conf). Do not publish 80/443 here:
# nginx already owns those ports on the target host.
#
# Config layout: the host directory ./config is mounted over the container's
# settings_prod directory. It must contain .secrets.toml. Migrating from the old
# single-file layout (./config.toml on the host):
#   mkdir -p config && mv config.toml config/.secrets.toml && chmod 600 config/.secrets.toml
# The parent directory is mounted rather than the file itself so the dashboard
# config editor can back up and atomically replace .secrets.toml.
services:
  achord-review:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: github_app
    image: achord-review:latest
    container_name: achord-review
    restart: unless-stopped
    ports:
      - "127.0.0.1:33001:3000"
    volumes:
      - ./config:/app/pr_agent/settings_prod
      # Dashboard SQLite database (review history, audit logs); survives restarts.
      - ./data:/app/data
    environment:
      # In-memory dashboard sessions live per worker process, so this
      # deployment must run exactly one worker — with several, a login served
      # by one worker would 401 on a sibling. One uvicorn worker still answers
      # health checks while a review runs (all I/O is async).
      GUNICORN_WORKERS: "1"
    mem_limit: 900m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
