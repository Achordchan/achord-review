# achord-review — central GitHub App deployment
#
# The container binds to loopback only; the host's existing nginx terminates TLS and
# reverse-proxies to it (see nginx-achord-review.conf). Do not publish 80/443 here:
# nginx already owns those ports on the target host.
#
# Config layout: the host directory ./config is mounted over the container's
# settings_prod directory. It must contain .secrets.toml. Migrating from the old
# single-file layout (./config.toml on the host):
#   mkdir -p config && mv config.toml config/.secrets.toml && chmod 600 config/.secrets.toml
# The parent directory is mounted rather than the file itself so the dashboard
# config editor can back up and atomically replace .secrets.toml.
services:
  achord-review:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: github_app
    image: achord-review:latest
    container_name: achord-review
    restart: unless-stopped
    # In-panel updates (opt-in): run the app FROM the mounted checkout so a
    # git-pull + self-restart actually loads new code. `python -m gunicorn` puts
    # the working directory at sys.path[0], ahead of PYTHONPATH, so without this
    # the baked /app/pr_agent shadows the mounted checkout and the pull has no
    # effect. Uncomment this together with the ../.. mount and the two
    # ACHORD_REVIEW_* env vars below.
    #working_dir: /app/repo
    # The panel runs `git pull` as the container user. As root (the default) fetched
    # objects become root-owned in the mounted checkout — fine when that checkout is
    # root-managed (the shipped /opt/achord-review is). If a non-root host user owns
    # it, map the container to that user's UID:GID so host-side git stays writable:
    #user: "1000:1000"
    ports:
      - "127.0.0.1:33001:3000"
    volumes:
      - ./config:/app/pr_agent/settings_prod
      # Dashboard SQLite database (review history, audit logs); survives restarts.
      - ./data:/app/data
      # --- In-panel code updates (opt-in) -------------------------------------
      # Mount the repo root (the same tree this image is built from) so the panel's
      # "check update / one-click update" can git-pull live code that the app then
      # imports. No separate clone needed. Uncomment together with working_dir above
      # and the two ACHORD_REVIEW_* env vars below. Code-only updates apply on
      # restart; a change to requirements.txt / pyproject.toml / Dockerfile still
      # needs a host rebuild — the panel detects this and blocks the restart.
      #- ../..:/app/repo
      # With working_dir /app/repo the app imports pr_agent from the checkout, so
      # config_loader resolves settings_prod relative to /app/repo/pr_agent. Mount
      # the same config there too, or the deployed secrets go unread after a
      # self-restart. (The /app/pr_agent/settings_prod mount above still covers the
      # baked package for the pre-opt-in boot.)
      #- ./config:/app/repo/pr_agent/settings_prod
    environment:
      # Keep at least two workers (the gunicorn default) so a slow provider call
      # cannot stall health checks and unrelated webhooks. Dashboard sessions
      # and login lockouts are shared through SQLite; config changes are picked
      # up by each worker on its next request.
      GUNICORN_WORKERS: "2"
      # The published port is loopback-only behind the single documented nginx.
      # Direct/custom deployments default to zero trusted hops and must opt in.
      DASHBOARD_TRUSTED_PROXY_HOPS: "1"
      # Exact public browser origin used by the CSRF fallback when Fetch
      # Metadata headers are unavailable. Scheme and effective port matter.
      DASHBOARD_EXTERNAL_ORIGIN: "https://review.achord.cn"
      # In-panel updates (opt-in) — uncomment together with working_dir and the
      # ../.. mount above. Point git operations at the mounted checkout and allow a
      # socket-free self-restart that exits PID 1 so `restart: unless-stopped`
      # respawns a fresh process importing the pulled code. No Docker socket.
      #ACHORD_REVIEW_REPO_DIR: "/app/repo"
      #ACHORD_REVIEW_SELF_RESTART: "1"
      # Left commented by default: releases stay host-managed
      # (git pull --ff-only + docker compose up -d --build).
    mem_limit: 900m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
