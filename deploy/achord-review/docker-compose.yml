# achord-review — central GitHub App deployment
#
# The container binds to loopback only; the host's existing nginx terminates TLS and
# reverse-proxies to it (see nginx-achord-review.conf). Do not publish 80/443 here:
# nginx already owns those ports on the target host.
#
# Config layout: the host directory ./config is mounted over the container's
# settings_prod directory. It must contain .secrets.toml. Migrating from the old
# single-file layout (./config.toml on the host):
#   mkdir -p config && mv config.toml config/.secrets.toml && chmod 600 config/.secrets.toml
# The parent directory is mounted rather than the file itself so the dashboard
# config editor can back up and atomically replace .secrets.toml.
services:
  achord-review:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: github_app
    image: achord-review:latest
    container_name: achord-review
    restart: unless-stopped
    ports:
      - "127.0.0.1:33001:3000"
    volumes:
      - ./config:/app/pr_agent/settings_prod
      # Dashboard SQLite database (review history, audit logs); survives restarts.
      - ./data:/app/data
      # --- In-panel code updates (opt-in) -------------------------------------
      # Mount a host git checkout so the panel's "check update / one-click update"
      # can pull live code that the app then imports. Set it up once on the host:
      #   git clone <this repo> ./repo
      # then uncomment this mount together with the three ACHORD_REVIEW_* / PYTHONPATH
      # env vars below. Code-only updates apply on restart; changes to
      # requirements.txt / pyproject.toml / Dockerfile still need a host rebuild
      # (the panel detects this and says so).
      #- ./repo:/app/repo
    environment:
      # Keep at least two workers (the gunicorn default) so a slow provider call
      # cannot stall health checks and unrelated webhooks. Dashboard sessions
      # and login lockouts are shared through SQLite; config changes are picked
      # up by each worker on its next request.
      GUNICORN_WORKERS: "2"
      # The published port is loopback-only behind the single documented nginx.
      # Direct/custom deployments default to zero trusted hops and must opt in.
      DASHBOARD_TRUSTED_PROXY_HOPS: "1"
      # Exact public browser origin used by the CSRF fallback when Fetch
      # Metadata headers are unavailable. Scheme and effective port matter.
      DASHBOARD_EXTERNAL_ORIGIN: "https://review.achord.cn"
      # In-panel updates (opt-in) — uncomment together with the ./repo mount above.
      # Run the app from the mounted checkout, let the panel git-pull it, and allow
      # a socket-free self-restart that exits PID 1 so `restart: unless-stopped`
      # (below) respawns a fresh process importing the pulled code. No Docker socket.
      #ACHORD_REVIEW_REPO_DIR: "/app/repo"
      #PYTHONPATH: "/app/repo:/app"
      #ACHORD_REVIEW_SELF_RESTART: "1"
      # Left commented by default: the shipped image is not a checkout, so releases
      # are host-managed (git pull + docker compose up -d --build).
    mem_limit: 900m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
